<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="个人网站" />
    <title>个人网站</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f7fa; color: #1f2937; }
      main { width: min(680px, calc(100% - 32px)); margin: 64px auto; }
      section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(15, 23, 42, .05); }
      h1 { margin: 0 0 12px; font-size: 32px; }
      h2 { margin: 28px 0 8px; font-size: 20px; }
      p { margin: 8px 0; line-height: 1.7; color: #4b5563; }
      a { color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
      footer { margin-top: 18px; text-align: center; font-size: 14px; color: #6b7280; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>个人网站</h1>
        <p>你好，欢迎来到我的个人网站。</p>

        <h2>关于我</h2>
        <p>这里可以简单介绍你的身份、兴趣或正在做的事情。</p>

        <h2>联系方式</h2>
        <p>邮箱：<a href="mailto:example@example.com">example@example.com</a></p>
      </section>
      <footer>© 2026 个人网站</footer>
    </main>
  </body>
</html>
